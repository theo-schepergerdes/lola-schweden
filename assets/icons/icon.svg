<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <radialGradient id="bg" cx="50%" cy="35%" r="80%">
      <stop offset="0%" stop-color="#12183a"/>
      <stop offset="100%" stop-color="#05060f"/>
    </radialGradient>
    <radialGradient id="moon" cx="40%" cy="35%" r="70%">
      <stop offset="0%" stop-color="#fffaf0"/>
      <stop offset="100%" stop-color="#d9d2c4"/>
    </radialGradient>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="10" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <rect width="512" height="512" rx="112" fill="url(#bg)"/>

  <!-- Mond -->
  <circle cx="320" cy="196" r="92" fill="url(#moon)" filter="url(#glow)"/>
  <circle cx="286" cy="170" r="16" fill="#b4ac9c" opacity="0.35"/>
  <circle cx="344" cy="210" r="12" fill="#b4ac9c" opacity="0.35"/>
  <circle cx="322" cy="238" r="9"  fill="#b4ac9c" opacity="0.35"/>

  <!-- Sterne -->
  <g fill="#eef2ff">
    <circle cx="120" cy="140" r="6"/>
    <circle cx="170" cy="300" r="5"/>
    <circle cx="96"  cy="360" r="7"/>
    <circle cx="220" cy="410" r="4"/>
    <circle cx="400" cy="360" r="6"/>
    <circle cx="150" cy="220" r="3"/>
    <circle cx="380" cy="120" r="4"/>
  </g>

  <!-- kleines Herz aus Sternenlicht -->
  <path d="M256 430c-46-30-78-56-78-92 0-22 16-38 38-38 14 0 24 8 40 26 16-18 26-26 40-26 22 0 38 16 38 38 0 36-32 62-78 92z"
        fill="#ff6b8a" opacity="0.9" filter="url(#glow)"/>
</svg>
