



<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8" />
  <!-- Mobile-First: viewport-fit=cover nutzt die volle Fläche inkl. Notch/Safe-Areas -->
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <meta name="theme-color" content="#05060f" />
  <meta name="description" content="Ein kleiner Himmel für dich." />

  <!-- iOS: als Web-App auf dem Homescreen behandeln -->
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="Unser Himmel" />
  <link rel="apple-touch-icon" href="assets/icons/icon.svg" />
  <link rel="icon" type="image/svg+xml" href="assets/icons/icon.svg" />

  <!-- PWA -->
  <link rel="manifest" href="manifest.json" />

  <title>Der Himmel über uns</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>

  <!-- ===================================================================
       HINTERGRUND: Canvas für Sterne, Mond, Nebel, Sternschnuppen, Aurora
       Wird komplett per JavaScript gezeichnet (requestAnimationFrame).
  ==================================================================== -->
  <canvas id="sky" aria-hidden="true"></canvas>

  <!-- Sanfter Farbverlauf-Layer über dem Canvas (zusätzliche Tiefe) -->
  <div class="sky-gradient" aria-hidden="true"></div>

  <!-- ===================================================================
       INTRO-ANIMATION (nur beim ersten Besuch)
  ==================================================================== -->
  <div id="intro" class="intro" role="dialog" aria-label="Willkommen">
    <div class="intro__inner">
      <div class="intro__star" aria-hidden="true"></div>
      <p class="intro__text">Für dich.</p>
    </div>
  </div>

  <!-- ===================================================================
       KOPFBEREICH: die zwei Textzeilen (blenden langsam ein)
  ==================================================================== -->
  <header class="hero" id="hero">
    <p class="hero__quote">
      Wenn du dich mal schlecht fühlst, <br />
      dann schau in diesen Himmel
    </p>
    <p class="hero__hint" id="hero-hint">Tippe auf die Sterne!</p>
  </header>

  <!-- ===================================================================
       INTERAKTIVE STERNE (Erinnerungen) – als DOM-Elemente
       Werden von script.js aus dem `memories`-Array erzeugt.
  ==================================================================== -->
  <div id="stars" class="stars" aria-label="Erinnerungssterne"></div>

  <!-- ===================================================================
       BEDIENELEMENTE unten (Herz = Countdown, Note = Ton an/aus)
  ==================================================================== -->
  <div class="controls" role="toolbar" aria-label="Steuerung">
    <button id="sound-btn" class="control-btn" aria-pressed="false" aria-label="Ton einschalten">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 9v6h4l5 5V4L8 9H4z"/><path class="wave" d="M16 8c1.5 1.2 1.5 6.8 0 8"/></svg>
    </button>

    <button id="heart-btn" class="control-btn control-btn--heart" aria-label="Countdown öffnen">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 21s-7-4.5-9.5-9C.7 8.6 2.2 5 5.5 5 7.6 5 9 6.3 12 9c3-2.7 4.4-4 6.5-4 3.3 0 4.8 3.6 3 7-2.5 4.5-9.5 9-9.5 9z"/></svg>
    </button>
  </div>

  <!-- Fortschrittsanzeige: "Du hast bereits X von Y Erinnerungen entdeckt." -->
  <div id="progress" class="progress" aria-live="polite"></div>

  <!-- ===================================================================
       OVERLAY: geöffnete Erinnerung (iOS-Card mit Glassmorphism)
  ==================================================================== -->
  <div id="memory-overlay" class="overlay" aria-hidden="true">
    <div class="overlay__backdrop" data-close></div>

    <article class="card" id="memory-card" role="dialog" aria-modal="true" aria-labelledby="card-title">
      <!-- Griff-Anzeiger zum Herunterwischen -->
      <div class="card__grabber" aria-hidden="true"></div>

      <button class="card__close" data-close aria-label="Schließen">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"/></svg>
      </button>

      <div class="card__scroll">
        <div class="card__media" id="card-media"><!-- Bild / Video / Audio dynamisch --></div>
        <h2 class="card__title" id="card-title"></h2>
        <p class="card__text" id="card-text"></p>
      </div>
    </article>
  </div>

  <!-- ===================================================================
       TOAST: Nachricht einer angetippten Sternschnuppe
  ==================================================================== -->
  <div id="shooting-message" class="toast" aria-live="polite" aria-hidden="true"></div>

  <!-- ===================================================================
       OVERLAY: Countdown bis zur Rückkehr
  ==================================================================== -->
  <div id="countdown-overlay" class="overlay" aria-hidden="true">
    <div class="overlay__backdrop" data-close></div>

    <div class="countdown" role="dialog" aria-modal="true" aria-label="Countdown bis zur Rückkehr">
      <button class="card__close" data-close aria-label="Schließen">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"/></svg>
      </button>

      <p class="countdown__label">Bis wir uns wiedersehen</p>
      <div class="countdown__grid" id="countdown-grid"><!-- Zahlen dynamisch --></div>
      <p class="countdown__sub" id="countdown-sub"></p>
    </div>
  </div>

  <!-- ===================================================================
       FINALE: Herz aus Sternen + "Willkommen zurück"
  ==================================================================== -->
  <div id="finale" class="finale" aria-hidden="true">
    <canvas id="finale-canvas"></canvas>
    <p class="finale__text" id="finale-text">Willkommen zurück ❤️</p>
  </div>

  <script src="script.js"></script>
</body>
</html>
